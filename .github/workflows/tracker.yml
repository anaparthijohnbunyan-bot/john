name: AMB Cinemas Ticket Tracker

on:
  schedule:
    - cron: '*/15 * * * *' # Scans every 15 minutes automatically
  workflow_dispatch: # Allows you to trigger a test run manually

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Ticket Checker Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests

          url = "https://bookmyshow.com"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          try:
              response = requests.get(url, headers=headers, timeout=15)
              
              # Checks for the movie text or active show dates
              if "Avengers" in response.text or "27" in response.text:
                  api_url = f"https://telegram.org{token}/sendMessage"
                  msg = "🚨 ALERT! Avengers Endgame Sunday tickets at AMB Cinemas might be live! Check BookMyShow now: " + url
                  requests.post(api_url, data={"chat_id": chat_id, "text": msg})
                  print("Tickets detected! Notification sent to Telegram.")
              else:
                  print("Checked. Sunday shows not live yet.")
          except Exception as e:
              print(f"Error checking site: {e}")
          EOF
